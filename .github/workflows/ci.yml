name: benchmark-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install benchmark
        run: python -m pip install -e '.[dev,openai]'
      - name: Validate suite contract
        run: faraday-bench validate
      - name: Verify vendored upstream integrity
        run: faraday-bench upstreams --verify
      - name: Run tests
        run: python -m pytest -q

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Lint
        run: npm run lint
      - name: Build website
        run: npm run build
