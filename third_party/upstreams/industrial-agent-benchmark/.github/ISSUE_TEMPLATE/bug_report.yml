name: Bug Report / バグ報告
description: Report a problem with the dataset, validation, export, or evaluation scripts. / データセット・検証・エクスポート・評価スクリプトの不具合報告
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do NOT paste generated model answers, judge outputs, provider-specific results, or API keys (Public Artifact Policy).
        バグ報告ありがとうございます。生成された回答・judge出力・プロバイダ固有の結果・APIキーは貼らないでください(Public Artifact Policy)。
  - type: textarea
    id: description
    attributes:
      label: Description / 概要
      description: What happened, and what did you expect? / 何が起きたか、何を期待していたか
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / 再現手順
      description: Exact commands you ran. / 実行したコマンド
      placeholder: |
        python scripts/validate_dataset.py
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Actual output / 実際の出力
      render: text
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Benchmark release version / リリースバージョン
      placeholder: "v2.2.0"
    validations:
      required: true
