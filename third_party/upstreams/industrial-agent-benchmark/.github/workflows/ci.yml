name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate benchmark YAML dataset
        run: python scripts/validate_dataset.py

      - name: Export HF JSONL dataset
        run: python scripts/export_hf_dataset_v2.py

      - name: Check exported JSONL matches committed file
        run: git diff --exit-code data/v2/test.jsonl

      - name: Validate HF JSONL dataset
        run: python scripts/validate_hf_dataset_v2.py data/v2/test.jsonl

      - name: Run tests
        run: python -m pytest tests/ -q
